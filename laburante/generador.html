<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Tarjetas | Laburando Sierras Web</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* VARIABLES DE DISEÑO */
    :root {
      --color-primario: #00c2cb;
      --color-oscuro: #1a1a1a;
      --color-fondo: #f4f5f7;
      --fuente-principal: 'Montserrat', sans-serif;
    }

    body {
      font-family: var(--fuente-principal);
      background: #e2e8f0;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    /* INTERFAZ EN PANTALLA */
    .controles {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 600px;
      margin: 0 auto 30px auto;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .controles h2 { margin-top: 0; color: var(--color-oscuro); font-weight: 800; }
    .grupo-form { margin-bottom: 15px; }
    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
      font-family: var(--fuente-principal);
    }
    button {
      background: var(--color-oscuro);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    button:hover:not(:disabled) { background: var(--color-primario); }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }

    #zona-impresion { display: none; }

    /* ESTILOS DE IMPRESIÓN */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      
      .controles { display: none !important; }
      body { background: white; padding: 0; margin: 0; }
      #zona-impresion { display: block; }
      @page { margin: 0; size: A4; }

      .formato-tarjetas {
        width: 210mm;
        min-height: 297mm;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 54mm;
        padding: 12mm 10mm;
        box-sizing: border-box;
        gap: 2mm;
      }

      .tarjeta {
        width: 90mm;
        height: 50mm;
        margin: auto;
        position: relative;
        overflow: hidden;
        background: var(--color-fondo);
        box-sizing: border-box;
        border: 1px dashed #ccc;
      }

      .tarjeta-fondo {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
      }

      .tarjeta-contenido {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 6mm;
        box-sizing: border-box;
      }

      .top-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .info-persona { max-width: 62%; }
      .info-persona h1 { 
        margin: 0; 
        font-size: 13px; 
        font-weight: 800; 
        color: var(--color-oscuro);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        line-height: 1.1;
      }
      .info-persona p { 
        margin: 3px 0 0 0; 
        font-size: 8.5px; 
        font-weight: 600; 
        color: #555; 
      }

      .qr-box {
        background: white;
        padding: 2px;
        border-radius: 4px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .qr-box img { width: 17mm; height: 17mm; }

      .bottom-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .tagline {
        font-size: 7px;
        font-weight: 800;
        color: white;
        margin-bottom: 1mm;
      }

      .contacto-lista {
        list-style: none;
        padding: 0;
        margin: 0;
        text-align: right;
      }
      .contacto-lista li {
        font-size: 7px;
        color: white;
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
      }
      .icon-circle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 11px;
        height: 11px;
        background: white;
        border-radius: 50%;
        color: var(--color-oscuro);
      }
      .icon-circle svg { width: 6px; height: 6px; fill: currentColor; }
    }
  </style>
</head>
<body>

  <div class="controles no-print">
    <h2>Imprimir Tarjetas de Laburantes</h2>
    <div class="grupo-form">
      <label for="select-laburante"><strong>Selecciona un Negocio / Profesional:</strong></label>
      <select id="select-laburante">
        <option value="">Cargando datos desde negocios.json...</option>
      </select>
    </div>
    <button id="btn-tarjetas" disabled onclick="imprimirTarjetas()">🖨️ Imprimir Hoja A4 (10 Tarjetas)</button>
  </div>

  <div id="zona-impresion"></div>

  <script>
    let datosNegocios = {};
    const select = document.getElementById('select-laburante');
    const btnTarjetas = document.getElementById('btn-tarjetas');
    const zonaImpresion = document.getElementById('zona-impresion');

    // Cargar dinámicamente negocios.json
    document.addEventListener('DOMContentLoaded', () => {
      fetch('negocios.json')
        .then(response => response.json())
        .then(data => {
          datosNegocios = data;
          select.innerHTML = '<option value="">-- Selecciona un laburante --</option>';
          
          for (const id in data) {
            const item = data[id];
            const option = document.createElement('option');
            option.value = id;
            option.textContent = item.nombre || id;
            select.appendChild(option);
          }
        })
        .catch(error => {
          console.error('Error al cargar negocios.json:', error);
          select.innerHTML = '<option value="">Error al cargar los negocios</option>';
        });
    });

    select.addEventListener('change', (e) => {
      btnTarjetas.disabled = e.target.value === "";
    });

    const svgPhone = `<svg viewBox="0 0 512 512"><path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64C0 311.4 200.6 512 448 512c18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368C234.3 334.7 177.3 277.7 144 207.3L193.3 167c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/></svg>`;
    const svgMap = `<svg viewBox="0 0 384 512"><path d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/></svg>`;
    const svgWeb = `<svg viewBox="0 0 512 512"><path d="M352 256c0 22.2-1.2 43.6-3.3 64H163.3c-2.2-20.4-3.3-41.8-3.3-64s1.2-43.6 3.3-64H348.7c2.2 20.4 3.3 41.8 3.3 64zm28.8-64H503.9c5.3 20.5 8.1 41.9 8.1 64s-2.8 43.5-8.1 64H380.8c2.1-20.6 3.2-42 3.2-64s-1.1-43.4-3.2-64zm112.6-32H376.7c-10-63.9-29.8-117.4-55.3-151.6c78.3 20.7 142 77.5 171.9 151.6zm-149.1 0H167.7c6.1-36.4 15.5-68.6 27-94.7c10.5-23.6 22.2-40.7 33.5-51.5C239.4 3.2 248.7 0 256 0s16.6 3.2 27.8 13.8c11.3 10.8 23 27.9 33.5 51.5c11.6 26 20.9 58.2 27 94.7zm-209 0H18.6C48.6 85.9 112.2 29.1 190.6 8.4C165.1 42.6 145.3 96.1 135.3 160zM8.1 192H131.2c-2.1 20.6-3.2 42-3.2 64s1.1 43.4 3.2 64H8.1C2.8 299.5 0 278.1 0 256s2.8-43.5 8.1-64zM194.7 446.6c-11.6-26-20.9-58.2-27-94.7H344.3c-6.1 36.4-15.5 68.6-27 94.7c-10.5 23.6-22.2 40.7-33.5 51.5C272.6 508.8 263.3 512 256 512s-16.6-3.2-27.8-13.8c-11.3-10.8-23-27.9-33.5-51.5zM135.3 352c10 63.9 29.8 117.4 55.3 151.6C112.2 482.9 48.6 426.1 18.6 352H135.3zm358.1 0c-30 74.1-93.6 130.9-171.9 151.6c25.5-34.2 45.2-87.7 55.3-151.6H493.4z"/></svg>`;

    function imprimirTarjetas() {
      const id = select.value;
      const item = datosNegocios[id];

      if (!item) return;

      const nombre = item.nombre || "Servicio Profesional";
      
      let rubro = "Oficios y Servicios";
      if (item.servicios && Array.isArray(item.servicios) && item.servicios.length > 0) {
        rubro = item.servicios[0];
      } else if (item.descripcion) {
        rubro = item.descripcion.substring(0, 32) + "...";
      }

      const tel = item.whatsapp || item.telefono || "";
      const ubi = item.ubicacion || "";
      const web = "laburando.sierrasweb.com.ar";

      const urlPerfil = `https://laburando.sierrasweb.com.ar/laburante/perfil.html?id=${id}`;
      const urlQR = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(urlPerfil)}`;

      zonaImpresion.innerHTML = ''; 
      let tarjetasHTML = '<div class="formato-tarjetas">';

      for (let i = 0; i < 10; i++) {
        tarjetasHTML += `
          <div class="tarjeta">
            <svg class="tarjeta-fondo" viewBox="0 0 340 189" preserveAspectRatio="none">
              <path d="M0 130 C 50 140 80 189 80 189 L 0 189 Z" fill="#e2e8f0"/>
              <path d="M 120,189 C 180,189 170,90 240,40 C 280,10 340,15 340,15 L 340,189 Z" fill="var(--color-primario)" />
              <path d="M 170,189 C 220,160 260,120 340,100 L 340,189 Z" fill="var(--color-oscuro)" />
            </svg>

            <div class="tarjeta-contenido">
              <div class="top-section">
                <div class="info-persona">
                  <h1>${nombre}</h1>
                  <p>${rubro}</p>
                </div>
                <div class="qr-box">
                  <img src="${urlQR}" alt="QR">
                </div>
              </div>

              <div class="bottom-section">
                <div class="tagline">${web}</div>
                <ul class="contacto-lista">
                  ${ubi ? `<li>${ubi} <span class="icon-circle">${svgMap}</span></li>` : ''}
                  ${tel ? `<li>${tel} <span class="icon-circle">${svgPhone}</span></li>` : ''}
                  <li>${web} <span class="icon-circle">${svgWeb}</span></li>
                </ul>
              </div>
            </div>
          </div>
        `;
      }
      
      tarjetasHTML += '</div>';
      zonaImpresion.innerHTML = tarjetasHTML;

      setTimeout(() => {
        window.print();
      }, 600);
    }
  </script>
</body>
</html>
